# Same CI as .gitlab-ci.yml: ONE job running tools/ci.sh. The CI_* variables that ci.sh reads are mapped from GitHub here,
# so tools/ci.sh stays unchanged. Secret needed: GRAPH_PUSH_TOKEN (a PAT with contents:write; GITHUB_TOKEN pushes do not start new runs).
name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    env:
      CI_MERGE_REQUEST_IID: ${{ github.event.pull_request.number }}
      CI_MERGE_REQUEST_TARGET_BRANCH_NAME: ${{ github.event.pull_request.base.ref }}
      CI_MERGE_REQUEST_SOURCE_BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
      CI_SERVER_HOST: github.com
      CI_PROJECT_PATH: ${{ github.repository }}
      GRAPH_PUSH_TOKEN: ${{ secrets.GRAPH_PUSH_TOKEN }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash tools/ci.sh
