# ONE job in ONE stage for every merge request and for master (DOMAINS.md, "Git workflow"). Replaces the ten jobs of before
# (domain, graph, tests:*): each job cost a container start, a clone and its installs. The work is in tools/ci.sh:
# domain check, graph/ (committed to the merge request branch by CI), PHP, data and JS tests.
# GitLab.com note: shared runners need the account to be verified and use the monthly compute minutes of the plan (owner setup: DOMAINS.md).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: node:22-bookworm
  interruptible: true

ci:
  stage: test
  variables:
    GIT_DEPTH: '0'
  script:
    - bash tools/ci.sh
