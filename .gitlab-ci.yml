# Checks for every merge request and for master (DOMAINS.md, "Git workflow"). Replaces .github/workflows/ci.yml.
# GitLab.com note: shared runners need the account to be verified and use the monthly compute minutes of the plan (owner setup: DOMAINS.md, "Git workflow").
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: node:22-bookworm
  interruptible: true

stages: [check, test]

domain:
  stage: check
  # a branch may change only the domain(s) named in its name: <domain>/<task>
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  variables:
    GIT_DEPTH: '0'
  script:
    - git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - node tools/ci-check-pr.js "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

graph:
  stage: check
  # Builds graph/ from the source files (tools/make-graph.js) and keeps it as an artifact for a week. When the test "graph/ is up to date"
  # fails, take graph/ from this job and commit it (proposal 011). The job itself does not fail: the test reports a stale or oversized graph.
  rules: !reference [.test-rules, rules]
  script:
    - node tools/make-graph.js || echo "make-graph.js reported a problem (see above)"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - graph/

# When the test jobs run. Only when something the tests check or read changed. Documents skip them: changes/, todo/, proposals/,
# requests/, tasks/, tools/prompts/, .claude/, .gitlab/merge_request_templates/ and every *.md file (no test reads the text of a document).
# A new top-level folder with code or config must be added to this list.
.test-rules:
  rules:
    - changes:
        - 'app/**/*'
        - 'controller/**/*'
        - 'service/**/*'
        - 'config/**/*'
        - 'event/**/*'
        - 'language/**/*'
        - 'styles/**/*'
        - 'data/**/*'
        - 'dev/**/*'
        - 'tests/**/*'
        - 'context/**/*'
        - 'graph/**/*'
        - 'tools/*'
        - '.gitlab/CODEOWNERS'
        - '.gitlab-ci.yml'
        - '*.php'
        - '*.json'

# Tests per domain (tools/domains.json says which test file belongs to which domain; `node tests/js/run.js --domain=<name>` runs the JS test
# files of one domain). One job per domain, so a red job names the domain to fix. Every job runs under the same rules, so nothing is skipped
# that the single job ran before (a change in one domain can break the tests of another). tests/js/ci.test.js fails if a domain has no job.
# The five JS domains need only Node. `data` also needs PHP; `shared` needs ESLint and Playwright (browser and lint tests).
.test-job:
  stage: test
  rules: !reference [.test-rules, rules]

tests:sidebar:
  extends: .test-job
  script:
    - node tests/js/run.js --no-browser --domain=sidebar

tests:map:
  extends: .test-job
  script:
    - node tests/js/run.js --no-browser --domain=map

tests:core:
  extends: .test-job
  script:
    - node tests/js/run.js --no-browser --domain=core

tests:state:
  extends: .test-job
  script:
    - node tests/js/run.js --no-browser --domain=state

tests:campaigns:
  extends: .test-job
  script:
    - node tests/js/run.js --no-browser --domain=campaigns

tests:data:
  extends: .test-job
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq php-cli php-mbstring
  script:
    - php tests/php/run.php
    - php tests/data/run.php
    - node tests/js/run.js --no-browser --domain=data

tests:shared:
  extends: .test-job
  before_script:
    - apt-get update -qq
    - npm install -g eslint@9 playwright
    - npx playwright install --with-deps chromium
    - export NODE_PATH="$(npm root -g)"
  script:
    - node tests/js/run.js --domain=shared
