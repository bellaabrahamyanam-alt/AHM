# Checks for every pull request and for main (DOMAINS.md, "Git workflow").
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  domain:
    # a branch may change only the domain(s) named in its name: <domain>/<task>
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/ci-check-pr.js "$HEAD_REF" "origin/$BASE_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - name: Install eslint and playwright (the lint and browser tests)
        run: |
          npm install -g eslint@9 playwright
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - run: php tests/php/run.php
      - run: php tests/data/run.php
      - run: node tests/js/run.js
